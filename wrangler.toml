name = "sherr-i"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# every minute: reminders | 21:30 UTC = 03:00 IST: delete old chat history
crons = ["* * * * *", "30 21 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sherr-i"
database_id = "REPLACE_WITH_YOUR_D1_ID" # scripts/setup.sh fills this in
migrations_dir = "migrations"

[vars]
WHATSAPP_API_VERSION = "v23.0"
WHATSAPP_TEMPLATE_NAME = "sherr_update"
WHATSAPP_TEMPLATE_LANG = "en"
GEMINI_MODEL = "gemini-2.5-flash"
ALLOWED_NUMBERS = ""        # e.g. "919876543210,919988776655" while testing
SHERR_DISPLAY_NUMBER = ""   # your WhatsApp test number, shown to users

[observability]
enabled = true
