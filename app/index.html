<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sherr I</title>
<meta name="description" content="Sherr I — text it, it gets things done. By SherrByte.">
<meta name="theme-color" content="#0c0b0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Splash: claw marks rip open and reveal the tiger's eye -->
<div id="splash" class="splash" aria-hidden="true">
  <svg viewBox="0 0 360 400" class="splash-art">
    <defs>
      <mask id="claws" maskUnits="userSpaceOnUse">
        <rect width="360" height="400" fill="#000"/>
        <g fill="none" stroke="#fff" stroke-linecap="round">
          <path class="claw c1" d="M100 92 C92 140 104 190 94 236" stroke-width="30"/>
          <path class="claw c2" d="M140 54 C126 130 142 220 128 304" stroke-width="44"/>
          <path class="claw c3" d="M196 28 C180 120 206 240 186 334" stroke-width="86"/>
          <path class="claw c4" d="M256 26 C246 110 264 210 250 298" stroke-width="50"/>
        </g>
        <rect class="reveal-all" width="360" height="400" fill="#fff"/>
      </mask>
      <radialGradient id="glow"><stop offset="0" stop-color="#ffb867" stop-opacity=".95"/><stop offset="1" stop-color="#f0912f" stop-opacity="0"/></radialGradient>
    </defs>
    <image href="/img/tiger.jpg" x="0" y="0" width="360" height="360" mask="url(#claws)" class="tiger"/>
    <circle cx="192" cy="166" r="34" fill="url(#glow)" class="eye-glow"/>
    <text x="180" y="392" text-anchor="middle" class="splash-title">Sherr I</text>
  </svg>
  <p class="splash-tag">Bas bolo. Ho jaayega.</p>
</div>

<div class="app" id="app">
  <header class="top">
    <button class="brand" id="brandBtn" aria-label="Sherr I home">
      <img src="/img/tiger.jpg" alt="" class="brand-eye">
      <span class="brand-name">Sherr I</span>
    </button>
    <button class="pill" id="powersBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>
      <span>Powers</span><b id="powerCount">0</b>
    </button>
  </header>

  <main class="feed" id="feed" aria-live="polite">
    <section class="welcome" id="welcome">
      <h1 class="hand" id="hello">Namaste!</h1>
      <p>Text me what you need. I'll message people, find trains and hotels, make images and remind you.</p>
      <div class="chips" id="chips"></div>
    </section>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="icon-btn" id="micBtn" aria-label="Speak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Text Sherr I…" aria-label="Message"></textarea>
    <button type="submit" class="send" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<!-- Powers sheet -->
<div class="sheet" id="powers" role="dialog" aria-modal="true" aria-labelledby="powersTitle" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <h2 class="hand" id="powersTitle">Powers</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <p class="muted">Switch on what Sherr I can do for you. Anything that sends, calls or pays always waits for your tap.</p>
    <div id="powerList"></div>
    <div class="sheet-foot">
      <button class="link-btn" id="editProfile">Edit name and language</button>
      <button class="link-btn danger" id="clearChat">Clear chat</button>
    </div>
  </div>
</div>

<!-- First run -->
<div class="sheet" id="onboard" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden>
  <div class="sheet-card">
    <h2 class="hand" id="obTitle">Hey, I'm Sherr I</h2>
    <p class="muted">Two things and we're set.</p>
    <form id="obForm" class="ob-form">
      <label for="obName">What should I call you?</label>
      <input id="obName" required maxlength="40" placeholder="Jashwanth">
      <label for="obLang">Talk to me in</label>
      <select id="obLang">
        <option value="Hinglish">Hinglish</option>
        <option value="English">English</option>
        <option value="Hindi">हिंदी</option>
        <option value="Telugu">తెలుగు</option>
        <option value="Tamil">தமிழ்</option>
      </select>
      <div id="inviteRow" hidden>
        <label for="obInvite">Invite code</label>
        <input id="obInvite" maxlength="32" placeholder="TIGER-XXXX" autocapitalize="characters">
      </div>
      <p class="err" id="obErr" hidden></p>
      <button class="primary" type="submit">Start</button>
    </form>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
